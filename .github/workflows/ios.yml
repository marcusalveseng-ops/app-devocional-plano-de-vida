name: iOS MVP
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- PlanoDeVida.xcodeproj
          plutil -lint iOS/PlanoDeVida/Info.plist iOS/PlanoDeVida/PrivacyInfo.xcprivacy
      - name: Core tests
        run: swift test
      - name: Build iPhone app
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild -project PlanoDeVida.xcodeproj -scheme PlanoDeVida -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee artifacts/build.log
      - name: Select iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Exercise essential flows
        run: |
          set -o pipefail
          xcodebuild -project PlanoDeVida.xcodeproj -scheme PlanoDeVida -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/DerivedData -resultBundlePath artifacts/UITests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee artifacts/ui-tests.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d artifacts/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/UITests.xcresult --output-path artifacts/screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation
          path: artifacts/
          retention-days: 14
